; PlatformIO project config for the Display firmware.
;
; env:native runs lib/core's tests on the host machine (no ESP32 toolchain,
; no flashing) — see docs/adr/0005-googletest-native-testing.md. The device
; environment (env:esp32dev) is added in a later slice.

[env:native]
platform = native
test_framework = googletest
build_flags = -std=gnu++17
