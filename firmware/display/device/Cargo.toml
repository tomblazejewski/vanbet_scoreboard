[package]
name = "device"
version = "0.1.0"
authors = ["tomblazejewski <tomasz.blazejewski.1b@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "device"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"
# Pinned to the exact commits this crate has been built/flashed against
# (also captured in Cargo.lock) — an unpinned git patch resolves to
# whatever the branch HEAD is at build time, which is a real
# reproducibility risk given how fast-moving these crates are. Bump
# deliberately, not as a side effect of an unrelated dependency update.
[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git", rev = "f616563a87595032f06f1fec95b6816b1c11135c" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal.git", rev = "04faf8a9221d683615e6b911b2649fa70e85d644" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc.git", rev = "3bc7361aade1eb9845a979d06e621a69a3dfbaff" }

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
display-core = { path = "../core" }
display-rest = { path = "../rest" }
display-render = { path = "../render" }
mipidsi = "0.9"
embedded-graphics = "0.8"
anyhow = "1"
embedded-hal = "1"
embedded-svc = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embuild = "0.33"
